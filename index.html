<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEHUNK. | Dynamic E-Commerce Slider</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.5s ease, color 0.3s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        :root {
            --accent-color: #ff5e00; /* Advanced Cyber Orange Header/Glow */
            --bg-color: #0d0d0d;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-color) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        /* Navbar */
        nav {
            position: relative;
            z-index: 10;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
        }

        /* Main Showcase Area */
        .showcase-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            gap: 30px;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .showcase-container::-webkit-scrollbar {
            display: none;
        }

        /* Product Card */
        .product-card {
            min-width: 280px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            opacity: 0.5;
            transform: scale(0.85);
        }

        .product-card.active {
            opacity: 1;
            transform: scale(1.1);
            border-color: var(--accent-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-color);
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* Center Details Box */
        .details-panel {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto 40px auto;
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(20px);
        }

        .details-panel h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .details-panel p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 15px var(--accent-color);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 15px; }
            .search-bar { width: 100%; }
            .showcase-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">THEHUNK.</div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color:#888;"></i>
            <input type="text" placeholder="Search Apparel...">
        </div>
    </nav>

    <!-- Horizontal Product Slider Showcase -->
    <div class="showcase-container" id="showcase">
        
        <!-- Product 1: Cyber Orange Theme -->
        <div class="product-card active" 
             data-color="#ff5e00" 
             data-title="Classic Comfort Hoodie" 
             data-desc="Made with 100% premium 240 GSM heavyweight cotton. Designed for maximum street style and durability." 
             data-price="₹1,499">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1000&auto=format&fit=crop" alt="Orange Hoodie">
            <div class="product-title">Cyber Orange Hoodie</div>
            <div class="product-price">₹1,499</div>
        </div>

        <!-- Product 2: Purple Theme -->
        <div class="product-card" 
             data-color="#8a2be2" 
             data-title="Lavender Oversized Hoodie" 
             data-desc="Custom acid wash finish featuring relaxed drop-shoulder cut. Ideal for modern streetwear enthusiasts." 
             data-price="₹1,699">
            <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=1000&auto=format&fit=crop" alt="Lavender Hoodie">
            <div class="product-title">Lavender Hoodie</div>
            <div class="product-price">₹1,699</div>
        </div>

        <!-- Product 3: Crimson Red Theme -->
        <div class="product-card" 
             data-color="#dc143c" 
             data-title="Maroon Heavy Metal Hoodie" 
             data-desc="High-density vintage chest print. Engineered to last endless washes without fading." 
             data-price="₹1,599">
            <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?q=80&w=1000&auto=format&fit=crop" alt="Maroon Hoodie">
            <div class="product-title">Maroon Hoodie</div>
            <div class="product-price">₹1,599</div>
        </div>

        <!-- Product 4: Gold Theme -->
        <div class="product-card" 
             data-color="#d4af37" 
             data-title="Vintage Mustard Oversized Tee" 
             data-desc="Lightweight yet structured drop-shoulder tee with limited edition branding." 
             data-price="₹1,299">
            <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=1000&auto=format&fit=crop" alt="Mustard Tee">
            <div class="product-title">Mustard Tee</div>
            <div class="product-price">₹1,299</div>
        </div>

    </div>

    <!-- Active Product Details Box -->
    <div class="details-panel">
        <h3 id="activeTitle">Classic Comfort Hoodie</h3>
        <p id="activeDesc">Made with 100% premium 240 GSM heavyweight cotton. Designed for maximum street style and durability.</p>
        <div class="action-btns">
            <button class="btn btn-secondary">ADD TO CART</button>
            <a href="https://wa.me/910000000000?text=Hi,%20I%20want%20to%20order" id="buyLink" class="btn btn-primary">ORDER NOW</a>
        </div>
    </div>

    <!-- JavaScript to replicate Video Interaction & Color Switching -->
    <script>
        const cards = document.querySelectorAll('.product-card');
        const root = document.documentElement;
        const activeTitle = document.getElementById('activeTitle');
        const activeDesc = document.getElementById('activeDesc');
        const buyLink = document.getElementById('buyLink');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Remove active class from all
                cards.forEach(c => c.classList.remove('active'));

                // Set active to clicked
                card.classList.add('active');

                // Extract Data Attributes
                const themeColor = card.getAttribute('data-color');
                const title = card.getAttribute('data-title');
                const desc = card.getAttribute('data-desc');
                const price = card.getAttribute('data-price');

                // Update UI Theme & Text smoothly
                root.style.setProperty('--accent-color', themeColor);
                activeTitle.innerText = title;
                activeDesc.innerText = desc;
                buyLink.href = `https://wa.me/910000000000?text=Hi,%20I%20want%20to%20buy%20${encodeURIComponent(title)}%20for%20${price}`;

                // Scroll Card to Center
                card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            });
        });
    </script>
</body>
</html>
