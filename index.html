<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEHUNK. | Fullscreen Cinematic Experience</title>

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Fixed Fullscreen Background Container */
        .fullscreen-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transform-origin: center center;
            filter: brightness(0.7);
        }

        /* Overlay Dark Gradient for UI Readability */
        .overlay-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        /* Navbar Overlay */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
        }

        .btn-buy {
            background: #ff5e00;
            color: #000;
            padding: 10px 25px;
            font-weight: 900;
            border-radius: 30px;
            text-decoration: none;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 94, 0, 0.5);
        }

        /* Scroll Triggers Content Wrapper */
        .scroll-container {
            position: relative;
            z-index: 2;
            height: 500vh; /* Smooth multi-step scroll */
        }

        .scroll-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero-title {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.9);
            opacity: 0;
            transform: translateY(40px);
        }

        .hero-sub {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #ff5e00;
            margin-top: 15px;
            opacity: 0;
        }

        /* Next Content Section after Scroll */
        .content-section {
            position: relative;
            z-index: 5;
            background: #050505;
            padding: 100px 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .product-card-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">THEHUNK.</div>
        <a href="#shop" class="btn-buy">SHOP DROP 01</a>
    </nav>

    <!-- FULLSCREEN BACKDROP IMAGE (This transforms on scroll) -->
    <div class="fullscreen-viewport">
        <img id="mainBg" class="bg-image" src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=2000&auto=format&fit=crop" alt="Full View Outfit">
        <div class="overlay-vignette"></div>
    </div>

    <!-- SCROLL DRIVEN TEXT overlays -->
    <div class="scroll-container">
        <div class="scroll-section">
            <h1 class="hero-title" id="t1">THE FUTURE OF STREETWEAR</h1>
            <p class="hero-sub" id="s1">240 GSM HEAVYWEIGHT COTTON</p>
        </div>

        <div class="scroll-section">
            <h1 class="hero-title" id="t2" style="color: #ff5e00;">HAND-WASHED VINTAGE TEXTURE</h1>
            <p class="hero-sub" id="s2" style="color: #fff;">LIMITED TO 100 PIECES WORLDWIDE</p>
        </div>

        <div class="scroll-section">
            <h1 class="hero-title" id="t3">DROP 01 LIVE NOW</h1>
            <p class="hero-sub" id="s3">SCROLL DOWN TO EXPLORE CATALOG</p>
        </div>
    </div>

    <!-- CATALOG / FOOTER -->
    <div class="content-section" id="shop">
        <h2 style="text-align: center; font-size: 2.5rem; margin-bottom: 50px; color: #ff5e00;">THE COLLECTION</h2>
        <div class="product-card-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1000&auto=format&fit=crop" alt="Tee">
                <h3 style="margin-top: 15px;">Cyber Orange Heavy Tee</h3>
                <p style="color: #ff5e00; font-weight: 700; font-size: 1.3rem; margin-top: 10px;">₹1,299</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?q=80&w=1000&auto=format&fit=crop" alt="Tee">
                <h3 style="margin-top: 15px;">Acid Wash Graphic Tee</h3>
                <p style="color: #ff5e00; font-weight: 700; font-size: 1.3rem; margin-top: 10px;">₹1,399</p>
            </div>
        </div>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Timeline linked strictly to overall scroll
        let tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",
                end: "bottom bottom",
                scrub: 1.5
            }
        });

        // 1. Zoom into fabric & rotate slightly
        tl.to("#mainBg", { scale: 1.35, rotate: -3, duration: 3 })
          .to("#t1", { opacity: 1, y: 0, duration: 1.5 }, "<")
          .to("#s1", { opacity: 1, duration: 1.5 }, "<")
          .to("#t1, #s1", { opacity: 0, y: -40, duration: 1 })

        // 2. Pan image side & zoom further
          .to("#mainBg", { scale: 1.7, x: "-8%", rotate: 2, duration: 3 })
          .to("#t2", { opacity: 1, y: 0, duration: 1.5 }, "<")
          .to("#s2", { opacity: 1, duration: 1.5 }, "<")
          .to("#t2, #s2", { opacity: 0, y: -40, duration: 1 })

        // 3. Zoom out to original scale as we enter shop section
          .to("#mainBg", { scale: 1, x: "0%", rotate: 0, filter: "brightness(0.3)", duration: 3 })
          .to("#t3", { opacity: 1, y: 0, duration: 1.5 }, "<")
          .to("#s3", { opacity: 1, duration: 1.5 }, "<");
    </script>
</body>
</html>
